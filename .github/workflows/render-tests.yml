name: Testar renderizador de vídeo
on:
  push:
    paths:
      - 'app.py'
      - 'render_engine.py'
      - 'requirements.txt'
      - '.github/workflows/render-tests.yml'
  workflow_dispatch:
jobs:
  video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências e validar sintaxe
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app.py render_engine.py
      - name: Criar vídeo e capa de testes
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -f lavfi -i sine=frequency=400:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -y /tmp/original.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x180 -frames:v 1 -y /tmp/capa.png
      - name: Exportar projeto multicenas com capa e áudio
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from render_engine import render,parse_scenes
          scenes = parse_scenes('[{"start":0,"end":1.3,"look":"cinema","zoom":"leve","speed":1},{"start":1.3,"end":2.7,"look":"vibrante","zoom":"nenhum","speed":1.25}]',3,0,3,"natural")
          render(shutil.which('ffmpeg'), Path('/tmp/original.mp4'), None, Path('/tmp/capa.png'),
                 Path('/tmp/editado.mp4'), scenes,3,True,80,'voz',1.0,0.1,'horizontal',lambda n: None)
          assert Path('/tmp/editado.mp4').stat().st_size > 1000
          print('Renderização multicenas concluída:',Path('/tmp/editado.mp4').stat().st_size)
          PY
