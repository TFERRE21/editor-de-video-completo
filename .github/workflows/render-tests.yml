name: Testar renderizador de vídeo
on:
  push:
    paths:
      - 'app.py'
      - 'render_engine.py'
      - 'smart_edit.py'
      - 'captions.py'
      - 'requirements.txt'
      - '.github/workflows/render-tests.yml'
  workflow_dispatch:
jobs:
  video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências e validar sintaxe
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app.py render_engine.py smart_edit.py captions.py
      - name: Criar vídeo e capa de testes
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -f lavfi -i sine=frequency=400:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -y /tmp/original.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x180 -frames:v 1 -y /tmp/capa.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=300:sample_rate=48000 -t 3 -c:a aac -y /tmp/musica.m4a
      - name: Exportar projeto multicenas com capa e áudio
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from render_engine import render,parse_scenes,audio_filters
          scenes = parse_scenes('[{"start":0,"end":1.3,"look":"cinema","zoom":"leve","speed":1},{"start":1.3,"end":2.7,"look":"vibrante","zoom":"nenhum","speed":1.25}]',3,0,3,"natural")
          render(shutil.which('ffmpeg'), Path('/tmp/original.mp4'), None, Path('/tmp/capa.png'),
                 Path('/tmp/editado.mp4'), scenes,3,True,80,'voz',1.0,0.1,'horizontal',lambda n: None)
          assert Path('/tmp/editado.mp4').stat().st_size > 1000
          from smart_edit import automatic_plan
          plan=automatic_plan(shutil.which('ffmpeg'),Path('/tmp/original.mp4'),3,True,'social')
          assert plan and plan[0]['end']>plan[0]['start']
          from captions import to_srt_time
          assert to_srt_time(65.333)=='00:01:05,333'
          second = parse_scenes('[{"start":0,"end":1.5,"look":"vibrante","zoom":"proximo","speed":1,"transition":"fade"},{"start":1.5,"end":2.9,"look":"quente","zoom":"leve","speed":1,"transition":"fade"}]', 3, 0, 3, "natural")
          render(shutil.which('ffmpeg'),Path('/tmp/original.mp4'),Path('/tmp/musica.m4a'),Path('/tmp/capa.png'),
                 Path('/tmp/com-musica.mp4'),second,3,True,80,'voz',1,0.12,'vertical',lambda n: None)
          assert Path('/tmp/com-musica.mp4').stat().st_size > 1000
          for mode in ('estudio','podcast','forte','limpo','voz','original'):
              filt=audio_filters(mode,1.0,bass=3,treble=2,noise=70,gate=True)
              assert 'equalizer' in filt
              print('Áudio',mode,':',filt)
          render(shutil.which('ffmpeg'),Path('/tmp/original.mp4'),None,None,
                 Path('/tmp/previa-audio.mp4'),second[:1],3,True,85,'podcast',1.0,0.1,'horizontal',
                 lambda n: None,bass=4,treble=3,noise=80,gate=True)
          assert Path('/tmp/previa-audio.mp4').stat().st_size > 1000
          print('Renderização multicenas concluída:',Path('/tmp/editado.mp4').stat().st_size)
          PY
